services:
  - type: web
    name: bavya-video-portal
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    # Configure a persistent storage disk on the server for uploads
    disk:
      name: bavya-uploads-disk
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: PORT
        value: 5000
      - key: PERSISTENT_STORAGE_DIR
        value: /var/data
      - key: ADMIN_USERNAME
        value: BAVYA
      - key: ADMIN_PASSWORD
        value: admin123
      # Automatically fetch database connection settings from the database below
      - key: MYSQL_HOST
        fromDatabase:
          name: bavya-mysql-db
          property: host
      - key: MYSQL_USER
        fromDatabase:
          name: bavya-mysql-db
          property: user
      - key: MYSQL_PASSWORD
        fromDatabase:
          name: bavya-mysql-db
          property: password
      - key: MYSQL_DB
        fromDatabase:
          name: bavya-mysql-db
          property: database
      - key: MYSQL_PORT
        fromDatabase:
          name: bavya-mysql-db
          property: port

databases:
  - name: bavya-mysql-db
    databaseName: bavya_video_portal
    plan: free
